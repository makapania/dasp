[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-predict"
version = "0.4.0"
description = "Automated spectral analysis software for preprocessing, modeling, and ranking spectroscopy data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "deepspec contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "tksheet>=7.5.0",
    "xlsxwriter>=3.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    # Note: jcamp has dependency bug on Python 3.11+ (incorrectly requires "re")
    # "jcamp>=1.3.0",
    "spc-io>=0.2.0",
    "joblib>=1.3.0",
    # Resampling and utilities
    "imbalanced-learn>=0.11.0",
    "platformdirs>=3.0.0",
    "threadpoolctl>=3.0.0",
    # Vendor format support
    "specdal",
    "brukeropus",
    "specio-py310",
    "spectrochempy-omnic==0.2.1",
    "requests",
    # Note: agilent-ir-formats moved to optional (not available on Python 3.11+)
    # Optimization
    "optuna>=3.0.0",
    "pymoo>=0.6.0",
    # Advanced baseline correction
    "pybaselines>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "build>=0.7.0",
    "twine>=4.0.0",
]
agilent = [
    "agilent-ir-formats",  # Only available on Python 3.10
]

[project.scripts]
spectral-predict = "spectral_predict.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["spectral_predict"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["src"]
