name: CI

on:
  push:
    branches: [ main, master, develop ]
    # Docs-only pushes (PROJECT_STATUS / SESSION_LOG hand-offs) don't need a 2h test run.
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  # pyproject's addopts deselects `comprehensive` and `slow` tests from every plain
  # `pytest` run (push/PR jobs below). The long-tests job runs exactly those, nightly
  # and on manual dispatch, so their coverage is moved, not dropped.
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

# A new push to a PR supersedes its in-progress run (per-PR group, cancel-in-progress).
# Push runs (merges to main etc.) get a per-commit group: GitHub keeps at most one
# *pending* run per group and cancels an older pending run when a newer one queues,
# even with cancel-in-progress false, so a shared per-branch group would silently drop
# intermediate merges. Keying on the SHA gives every merge its own complete result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Cap native thread pools for every test process (tests/conftest.py sets the same
  # defaults before importing numpy; this also covers anything imported earlier).
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    # Default (fast) selection: pyproject addopts deselects comprehensive + slow.
    # Bound hangs well below the 6h default.
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 only: the project is 3.14-only (pyproject requires-python).
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      env:
        MPLBACKEND: Agg
      shell: bash
      run: |
        # tests/gui/ runs on Windows only: the app ships for Windows, so Linux
        # GUI coverage is not maintained. The informational Xvfb job that once hunted a
        # suspected Linux deadlock was removed on 2026-09-14: its stack dump
        # showed no deadlock — test_xgboost_via_gui was actively training and
        # legitimately needs far more than that job's 180s per-test budget
        # (~60 min on the Windows runner, which passes because it sets no
        # per-test timeout). The GUI suite is exercised natively by the
        # windows-latest leg below.
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          pytest -v --tb=short --ignore=tests/gui
        else
          pytest -v --tb=short
        fi

    # Informational: these steps were never reached while tests were red, and the
    # tree predates them (black would reformat ~212 files; flake8 reports ~1.8k
    # issues). Flip to blocking after a repo-wide format pass.
    - name: Check code formatting (black)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      continue-on-error: true
      run: |
        black --check src/ tests/

    - name: Run linter (flake8)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      continue-on-error: true
      run: |
        flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503

    # Blocking: the informational flake8 step above hides real bugs among the style
    # noise. These pyflakes codes are correctness errors, never style: F821 undefined
    # name, F822 undefined name in __all__, F823 local referenced before assignment.
    - name: Check for undefined names (flake8 F821/F822/F823)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      run: |
        flake8 src/ tests/ spectral_predict_gui_optimized.py --select=F821,F822,F823

  long-tests:
    # The tests pyproject's addopts deselects. Windows: the 34 `comprehensive` tests
    # build the real Tk session app (tests/gui/conftest.py), and the GUI suite is
    # Windows-only (see the test job). `-m` on the command line replaces addopts' -m.
    name: Nightly long tests (comprehensive + slow, Windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # test_xgboost_via_gui alone has needed ~60 min on this runner.
    timeout-minutes: 300

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run comprehensive and slow tests
      env:
        MPLBACKEND: Agg
      shell: bash
      run: |
        pytest -v --tb=short -m "comprehensive or slow"

  long-tests-linux:
    # The non-GUI slow tests used to run on ubuntu-latest in every PR; keep that Linux
    # coverage on the same nightly/dispatch schedule. GUI tests are Windows-only.
    name: Nightly long tests (slow, non-GUI, Linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run comprehensive and slow tests (non-GUI)
      env:
        MPLBACKEND: Agg
      run: |
        pytest -v --tb=short -m "comprehensive or slow" --ignore=tests/gui

  test-optional-deps:
    name: Test with optional dependencies
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install with ASD support
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,asd]

    - name: Run tests
      env:
        MPLBACKEND: Agg
      run: |
        # GUI tests are Windows-only; see the comment in the test job above.
        pytest -v --ignore=tests/gui

  build:
    name: Build package
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
