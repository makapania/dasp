name: CI

on:
  push:
    branches: [ main, master, develop ]
    # Docs-only pushes (PROJECT_STATUS / SESSION_LOG hand-offs) don't need a 2h test run.
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore: [ 'docs/**', '**/*.md' ]

# A new push to a PR supersedes its in-progress run. Pushes to main are never
# cancelled so every merge gets a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The full suite runs ~2h serially; bound hangs well below the 6h default.
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 only: the project is 3.14-only (pyproject requires-python).
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      env:
        MPLBACKEND: Agg
      shell: bash
      run: |
        # T-CI-2 (follow-up to T-CI-1): a still-unidentified test in tests/gui/
        # deadlocks under Xvfb and runs past the 6-hour job timeout. To keep
        # main green while the offender is hunted down, the headless Linux
        # matrix runs without tests/gui/. Windows runners exercise the GUI
        # suite natively. The dedicated `gui-linux` job below runs the GUI
        # suite under Xvfb + pytest-timeout in informational mode (does not
        # block CI) so the next time CI runs, the hanging test surfaces in
        # the logs instead of hiding behind a 6-hour wall-clock kill.
        # When T-CI-2 closes, drop the --ignore here and the
        # continue-on-error flag in gui-linux below.
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          pytest -v --tb=short --ignore=tests/gui
        else
          pytest -v --tb=short
        fi

    # Informational: these steps were never reached while tests were red, and the
    # tree predates them (black would reformat ~212 files; flake8 reports ~1.8k
    # issues). Flip to blocking after a repo-wide format pass.
    - name: Check code formatting (black)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      continue-on-error: true
      run: |
        black --check src/ tests/

    - name: Run linter (flake8)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      continue-on-error: true
      run: |
        flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503

  gui-linux:
    name: GUI tests (Linux Xvfb, informational)
    runs-on: ubuntu-latest
    # T-CI-2: informational-only until the hanging test is identified.
    # `continue-on-error: true` keeps this from blocking the merge queue
    # while still surfacing per-test pass/fail/timeout in the run summary.
    # Once the offender is quarantined with @pytest.mark.skip(reason="T-CI-2"),
    # flip this to false and remove --ignore=tests/gui from the test job.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Install Xvfb and Tk runtime
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb python3-tk

    - name: Run GUI tests under Xvfb with per-test timeout
      env:
        MPLBACKEND: TkAgg
      run: |
        # pytest-timeout uses the `thread` method to interrupt blocked tests
        # without needing SIGALRM. 180s/test is well above legitimate runtime
        # for the headless Tk smoke + workflow tests (most finish in <30s).
        # When the hanging test deadlocks, pytest-timeout aborts that test
        # specifically so the rest of the suite continues — that gives us
        # the test name we need to close T-CI-2.
        xvfb-run -a --server-args="-screen 0 1280x1024x24" \
          pytest tests/gui -v --tb=short \
            --timeout=180 --timeout-method=thread

  test-optional-deps:
    name: Test with optional dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install with ASD support
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,asd]

    - name: Run tests
      env:
        MPLBACKEND: Agg
      run: |
        # T-CI-2: GUI tests skipped on Linux. See the test job above.
        pytest -v --ignore=tests/gui

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
