name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      env:
        MPLBACKEND: Agg
      shell: bash
      run: |
        # GUI tests need real Tkinter + display — skipped on Linux runners.
        # Initial T-CI-1 attempt used xvfb-run -a but a (still-unidentified)
        # GUI test deadlocks under Xvfb and runs past the 6-hour job timeout.
        # Skipping tests/gui/ on Linux gives green CI without the hang;
        # Windows runners cover GUI tests natively. Coverage gap filed
        # separately for follow-up: identify the hanging test and re-enable.
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          pytest -v --tb=short --ignore=tests/gui
        else
          pytest -v --tb=short
        fi

    - name: Check code formatting (black)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        black --check src/ tests/

    - name: Run linter (flake8)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503

  test-optional-deps:
    name: Test with optional dependencies
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install with ASD support
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,asd]

    - name: Run tests
      env:
        MPLBACKEND: Agg
      run: |
        # GUI tests skipped on Linux — see comment in test job above.
        pytest -v --ignore=tests/gui

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
