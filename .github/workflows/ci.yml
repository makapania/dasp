name: CI

on:
  push:
    branches: [ main, master, develop ]
    # Docs-only pushes (PROJECT_STATUS / SESSION_LOG hand-offs) don't need a 2h test run.
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore: [ 'docs/**', '**/*.md' ]

# A new push to a PR supersedes its in-progress run. Pushes to main are never
# cancelled so every merge gets a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The full suite runs ~2h serially; bound hangs well below the 6h default.
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 only: the project is 3.14-only (pyproject requires-python).
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      env:
        MPLBACKEND: Agg
      shell: bash
      run: |
        # tests/gui/ runs on Windows only: the app ships for Windows, so Linux
        # GUI coverage is not maintained. The informational Xvfb job that once hunted a
        # suspected Linux deadlock was removed on 2026-09-14: its stack dump
        # showed no deadlock — test_xgboost_via_gui was actively training and
        # legitimately needs far more than that job's 180s per-test budget
        # (~60 min on the Windows runner, which passes because it sets no
        # per-test timeout). The GUI suite is exercised natively by the
        # windows-latest leg below.
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          pytest -v --tb=short --ignore=tests/gui
        else
          pytest -v --tb=short
        fi

    # Informational: these steps were never reached while tests were red, and the
    # tree predates them (black would reformat ~212 files; flake8 reports ~1.8k
    # issues). Flip to blocking after a repo-wide format pass.
    - name: Check code formatting (black)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      continue-on-error: true
      run: |
        black --check src/ tests/

    - name: Run linter (flake8)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      continue-on-error: true
      run: |
        flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503

  test-optional-deps:
    name: Test with optional dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install with ASD support
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,asd]

    - name: Run tests
      env:
        MPLBACKEND: Agg
      run: |
        # GUI tests are Windows-only; see the comment in the test job above.
        pytest -v --ignore=tests/gui

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
